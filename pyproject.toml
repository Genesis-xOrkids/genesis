[project]
name = "genesis"
version = "0.1.0"
description = "Genesis - AI fashion stylist (B2C) and trend & design studio (B2B)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.1.5",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pgvector>=0.5.1",
    "strawberry-graphql>=0.336.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "anthropic>=1.15.0",
    "structlog>=24.4.0",
    "protego>=0.7.0",
]

[project.optional-dependencies]
# Kept out of the default install. The API, the write path, and the ingestion
# pipelines never need torch, and making every deploy carry two gigabytes of it
# to serve a GraphQL query is the wrong trade.
embeddings = [
    "torch>=2.14.1",
    "open-clip-torch>=2.32.0",
    "transformers>=5.20.2",
    "pillow>=11.0.0",
]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The families past the original seven each enforce something the constitution
# already states but nothing checked. ERA, FIX and TD are "no transitional
# code: no TODOs, no disabled blocks". ARG and RET are "nothing without a
# purpose". DTZ keeps every `_at` value timezone-aware. SLF and BLE were
# already being suppressed by hand - twelve `# noqa: SLF001` and two
# `# noqa: BLE001` directives were in the tree for rules that were never
# switched on, so RUF100 read them as dead. Turning the rules on is what the
# author of those directives meant.
#
# S (bandit) is deliberately absent. 294 of its 295 findings here are `assert`
# in tests, which is how pytest is written; the remainder are a type-narrowing
# assert and a non-cryptographic sampler. Buying two findings with a
# per-file-ignore and two suppressions is not worth it, and gitleaks already
# covers the case that matters.
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "TID",
    "ARG",
    "BLE",
    "C4",
    "DTZ",
    "ERA",
    "FIX",
    "N",
    "PERF",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SLF",
    "TD",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Alembic fixes the signature of its include_object callback; the parameters it
# does not consult still have to be declared.
"api/alembic/env.py" = ["ARG001"]
# A pytest fixture requested for its side effect is used by being requested.
# The test body never names `seeded` or `storefront`, and naming them to satisfy
# a linter would be worse than the warning.
"api/tests/*.py" = ["ARG001", "ARG002"]
"intelligence/tests/*.py" = ["ARG001", "ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

# Tests are excluded: they build deliberately malformed inputs and substitute
# fakes for transports, and satisfying strict typing there means weakening the
# fakes until they stop resembling the failure being tested.
exclude = ["/tests/", "^evals/.*/fixtures/"]

# torch and PIL come from the optional embeddings extra, which CI does not
# install: two gigabytes of download on every run to typecheck one module is a
# bad trade. This only relaxes checking where the package is absent, so local
# runs with the extra installed still get the real types.
[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "strawberry.*",
    "open_clip.*",
    "httpx2.*",
    "protego.*",
    "torch.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["api/tests", "intelligence/tests", "scripts/tests", "evals/tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "alembic-postgresql-enum>=1.11.0",
]
