[project]
name = "genesis"
version = "0.1.0"
description = "Genesis - AI fashion stylist (B2C) and trend & design studio (B2B)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "strawberry-graphql>=0.256.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "anthropic>=0.40.0",
    "structlog>=24.4.0",
    "protego>=0.6.2",
]

[project.optional-dependencies]
# Kept out of the default install. The API, the write path, and the ingestion
# pipelines never need torch, and making every deploy carry two gigabytes of it
# to serve a GraphQL query is the wrong trade.
embeddings = [
    "torch>=2.6.0",
    "open-clip-torch>=2.32.0",
    "transformers>=4.50.0",
    "pillow>=11.0.0",
]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

# Tests are excluded: they build deliberately malformed inputs and substitute
# fakes for transports, and satisfying strict typing there means weakening the
# fakes until they stop resembling the failure being tested.
exclude = ["/tests/", "^evals/.*/fixtures/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "strawberry.*", "open_clip.*", "httpx2.*", "protego.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["api/tests", "intelligence/tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "alembic-postgresql-enum>=1.10.0",
]
