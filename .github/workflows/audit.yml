name: Weekly audit

# Layer 3 of the review gate, and the only layer that reads the whole repository
# at once.
#
# Dead code and redundancy are properties of the repository, not of a diff. A PR
# that deletes the last caller of a function makes that function dead, and the
# diff shows only a deletion; two PRs that each add half of a duplicated
# derivation are each clean on their own. Nothing scoped to one diff can see
# either, which is what this is for.
#
# Weekly rather than per-merge, on purpose. Run against the whole repository on
# every merge, this would file a near-identical report every time and be ignored
# inside a fortnight. Repository rot changes on a weekly scale, so that is the
# cadence it gets.

on:
  schedule:
    # Monday morning UTC, so the week opens with the list rather than closing on
    # it. GitHub runs scheduled workflows only from the default branch, and
    # attributes the run to whoever last edited this cron - if that ever becomes
    # a bot account, the action will refuse it until it is named in
    # `allowed_bots`.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The audit reads history: what changed recently is what is most
          # likely to have left something behind.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            Audit the whole repository against `CLAUDE.md`. Read it in full
            first. You are looking only for things that are true of the
            repository rather than of any one diff - the per-PR reviewer
            (`.github/workflows/review.yml`) already covers diffs, and CI covers
            everything mechanical. Do not repeat either.

            Run the deterministic checks first and report only what they cannot
            see:

                uv sync --extra dev
                uv run python scripts/check_orphans.py
                uv run python scripts/check_duplication.py

            Then look for the things that only a whole-repository read finds:

            1. **A fact stored in more than one place.** The constitution's
               single-source-of-truth rule. Compare the SQLAlchemy models
               against each other for the same fact under two names, and against
               `intelligence/catalog/normalized.py`.
            2. **Derivations that have drifted.** Two modules computing the same
               thing by different rules - a colour family, a size, a price
               conversion, a taxonomy mapping. Cite both.
            3. **Suppressions that outlived their reason.** Every `# noqa`,
               `# type: ignore`, `viewonly=True`, and every exclusion in
               `pyproject.toml`, `scripts/check_orphans.py` and
               `scripts/check_duplication.py`. For each, say whether the reason
               still holds. A stale exclusion is how a check quietly stops
               checking.
            4. **`second-brain/wiki/` claims the code no longer supports.** Run
               `second-brain/sync-raw.sh --check` first. Report pages that
               describe architecture that has changed, or record as "nothing
               built yet" something that now exists.
            5. **`ROADMAP.md` drift.** Milestones the code shows as done, or as
               abandoned, that the roadmap still lists otherwise.

            Every finding cites `path:line` and the `CLAUDE.md` section or
            `[[wiki-page]]` it violates. A finding you cannot attribute does not
            go in the report.

            Then file the report as a single issue titled exactly
            "Weekly audit: whole-repository findings". First check whether that
            issue is already open:

                gh issue list --state open --search "Weekly audit: whole-repository findings" --json number,title

            If it is open, replace its body with this week's report using
            `gh issue edit <number> --body-file <file>`, keeping a short
            "Previously reported and still open" section for anything unchanged
            from the existing body. If it is not open, create it with
            `gh issue create`. One issue that stays current, never a new issue
            each week - a weekly stack of near-identical issues is how this stops
            being read.

            If you find nothing, still update the issue (or skip creating one if
            none exists) and say plainly that the audit was clean, with the list
            of what you checked.
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Write,Bash(git:*),Bash(uv:*),Bash(rg:*),Bash(cat:*),Bash(sed:*),Bash(gh issue:*),Bash(second-brain/sync-raw.sh --check)"
