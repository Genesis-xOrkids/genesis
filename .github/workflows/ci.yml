name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default: no job needs to write to the repository, and a
# token that cannot write cannot be turned against the repo by a dependency.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector, matching Aurora in production. The schema uses native enums,
        # check constraints, and a vector column; a test run that cannot see
        # those is testing a different database than the one we deploy to.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: genesis
          POSTGRES_DB: genesis
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U genesis -d genesis"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      GENESIS_DATABASE_URL: postgresql+psycopg://genesis:genesis@localhost:5434/genesis

    steps:
      # Third-party actions are pinned to a commit SHA, not a tag. A tag is a
      # moving pointer the action's owner can repoint at any commit, so a
      # compromised or simply careless release runs in a job that already holds
      # our credentials. Dependabot proposes SHA bumps as reviewable PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: uv sync --extra dev

      # second-brain/site/build.py is listed by name rather than by directory:
      # it is the only Python in the vault, and the rest of second-brain/ is
      # prose that ruff has no business walking.
      - name: Lint
        run: uv run ruff check api/ intelligence/ services/ scripts/ evals/ conftest.py second-brain/site/build.py

      - name: Format
        run: uv run ruff format --check api/ intelligence/ services/ scripts/ evals/ conftest.py second-brain/site/build.py

      - name: Types
        run: uv run mypy api/genesis_api intelligence services evals

      - name: Migration chain has exactly one head
        working-directory: api
        run: |
          heads=$(uv run alembic heads | wc -l)
          test "$heads" -eq 1 || { uv run alembic heads; echo "expected 1 head, found $heads"; exit 1; }

      - name: Chain applies cleanly from empty
        working-directory: api
        run: uv run alembic upgrade head

      - name: No model/migration drift
        working-directory: api
        run: |
          uv run alembic revision --autogenerate -m "ci drift probe" >/dev/null
          probe=$(ls alembic/versions/*_ci_drift_probe.py)
          body=$(sed -n '/### commands auto generated/,/### end Alembic/p' "$probe" \
                 | grep -v '###' | grep -v '^\s*pass\s*$' | grep -v '^\s*$' || true)
          rm -f "$probe"
          if [ -n "$body" ]; then
            echo "a model changed without a matching migration, or vice versa:"
            echo "$body"
            exit 1
          fi

      - name: Every definition is reachable
        # Reachability from declared entrypoints, not a reference count. The
        # count let a docstring mention and a mutual-recursion cycle pass as
        # callers; both are now failures.
        run: uv run python scripts/check_orphans.py

      - name: No block of code is written twice
        run: uv run python scripts/check_duplication.py

      - name: No agent definition drift
        # Same shape as the migration drift gate above: run the generator and
        # fail if it would have changed anything. Run as a module so that the
        # repository root is on sys.path.
        run: uv run python -m scripts.generate_github_agents --check

      - name: No change to what the site publishes
        # Same shape as the drift gates above. `exclude.txt` holds pages back,
        # but exclusion is not redaction: the facts they concentrate stay quoted
        # across pages that do ship. The build records which published pages
        # still name a held-back one, and a change here means a person reads the
        # diff before the site deploys.
        #
        # It cannot catch a published page carrying a held-back fact without
        # linking to it. Nothing mechanical can. This narrows the surface.
        run: |
          python3 second-brain/site/build.py --target static >/dev/null
          git diff --exit-code -- second-brain/site/publication-report.txt || {
            echo
            echo "What this site publishes changed. Read the diff above:"
            echo "  a new line means a page now names something exclude.txt holds back;"
            echo "  a removed line means a page stopped naming one, or stopped shipping."
            echo "Then commit the regenerated report to accept it."
            exit 1
          }

      - name: Secrets
        # Free stand-in for GitHub's push protection, which costs money on
        # private repos. The binary is run directly rather than through
        # gitleaks-action: the action needs a paid licence once this moves to an
        # organization account, and running it here keeps one less third-party
        # action holding the job's token.
        #
        # This detects after the fact rather than blocking the push, so a hit
        # means rotate the credential, not just amend the commit.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner --config .gitleaks.toml

      - name: Tests
        # No network. The storefront connector runs against a captured payload,
        # so a third party's uptime can never fail this build.
        run: uv run pytest -q

  deploy:
    # Publication is downstream of every gate, so a red build cannot ship. Only
    # main, and only for real pushes - a pull request from a fork must never
    # reach the deploy credentials.
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Employees roster is derived from `git log`, so a shallow clone
          # does not fail - it publishes a page with almost no work history and
          # wrong run counts. Full history is a correctness requirement here,
          # not a convenience.
          fetch-depth: 0

      # No uv here: build.py imports only the standard library, so the runner's
      # own python3 is enough and Node comes preinstalled for wrangler.
      - name: Build both targets
        # The artifact target is built too, so a failure in it surfaces here
        # rather than the next time someone publishes by hand.
        #
        # It reads the run ledger out of D1 and bakes it in, because an artifact
        # has no worker to ask at render time. The static target does not: it
        # fetches /api/runs, so it needs no credentials and the `checks` job -
        # which builds it for the publication-report gate - still runs without
        # any. These are the same credentials the deploy step below uses, so
        # this adds no secret; the token does need D1 read alongside Pages write.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 second-brain/site/build.py --target static
          python3 second-brain/site/build.py --target artifact

      - name: Deploy to Cloudflare Pages
        working-directory: second-brain/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # `--branch main` is explicit rather than inferred: wrangler reads the
        # branch from git, and anything other than the production branch lands on
        # a preview host instead of the site.
        run: npx --yes wrangler pages deploy --branch main --commit-dirty=true
