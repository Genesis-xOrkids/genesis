name: Constitutional review

# Layer 2 of the review gate. CI's `checks` job holds everything a machine can
# decide: lint, types, migration drift, reachability, duplication, secrets,
# tests. This holds the half that needs judgement - a fact duplicated across the
# schema, a shared writer patched to fit one new case, an interpretive
# derivation stored on a domain row, a diff that contradicts a decision already
# recorded in second-brain/wiki/.
#
# Advisory on purpose, and deliberately NOT in branch protection's required
# contexts. A model timeout or a rate limit should cost a re-run, not a blocked
# merge, and a non-deterministic step has no business gating one.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# The reviewer reads and comments. It never needs to write to the repository,
# and a token that cannot push cannot be turned into one that does by anything
# it reads in the diff.
permissions:
  contents: read
  pull-requests: write
  id-token: write

# A push that lands while a review is running makes that review stale. Cancel it
# rather than paying for a report about code that has already moved.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Drafts are still being written. Reviewing one is noise the author has to
    # dismiss, and `ready_for_review` above catches it the moment it isn't.
    if: github.event.pull_request.draft == false

    steps:
      # Pinned to a commit SHA, not a tag, matching ci.yml: a tag is a moving
      # pointer its owner can repoint at any commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reviewer diffs from `git merge-base`, which a shallow clone
          # cannot compute. This is the one setting that silently produces an
          # empty or wrong review rather than an error.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The instructions live in the agent file, and this points at them
          # rather than restating them. Restating would duplicate the reviewer's
          # own rules into a second place, which is the thing the reviewer exists
          # to catch. It reads the file rather than invoking `/review` because
          # whether a `.claude/commands/` entry resolves as a skill on a runner
          # is not something this workflow should depend on.
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.sha }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            Read `.claude/agents/genesis-reviewer.md` in full and follow it
            exactly - it is the review's specification, including what counts as
            Blocking, Design and Note, and the requirement that every finding
            cites CLAUDE.md or a wiki page.

            The PR branch is already checked out with full history. Get the diff
            with `git diff $BASE...$HEAD` rather than assuming a range.

            Post one summary comment with `gh pr comment`, in the report shape
            that file describes. One comment, not inline comments: `main`
            requires conversation resolution, so an inline comment the author
            disagrees with blocks their merge until they dismiss it, and that
            is a cost this review has not yet earned.

            If you find nothing, say so in one line plus the "Checked and clean"
            list. Do not invent findings to look useful, and do not repeat
            anything CI already checks - ruff, mypy, alembic, reachability,
            duplication, gitleaks and pytest have all already run on this diff.
          claude_args: |
            --model claude-opus-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(rg:*),Bash(cat:*),Bash(sed:*),Bash(second-brain/sync-raw.sh --check)"
